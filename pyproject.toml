[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wildlife-detection"
version = "0.1.0"
description = "Qwen2.5-VL object detection evaluation on COCO-style wildlife data"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.6.0+cu124",
  "torchvision==0.21.0+cu124",
  "transformers==4.51.3",
  "accelerate==1.6.0",
  "peft==0.15.2",
  "Pillow==11.2.1",
  "pycocotools==2.0.10",
  "ultralytics==8.3.203",
  "tqdm==4.67.1",
  "lm-format-enforcer==0.11.3",
  "jsonschema>=4.18,<5",
  "pytest==8.3.5",
  "numpy==2.2.6",
  "opencv-python==4.11.0.86",
  "pandas==2.2.3",
  "scipy==1.15.3",
  "matplotlib==3.10.3",
  "polars==1.31.0",
]

[project.optional-dependencies]
legacy-awq = ["autoawq==0.2.9"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[project.scripts]
wildlife-detect = "wildlife_detection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
